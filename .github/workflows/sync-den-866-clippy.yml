name: sync DEN-866 clippy repair

on:
  push:
    branches:
      - agent/den-866-diversity-aware-recall
    paths:
      - .github/workflows/sync-den-866-clippy.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-866-diversity-aware-recall
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Replace fixed Vec with array and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/recall.rs')
          source = path.read_text()
          needle = 'let mut signals = vec!['
          if source.count(needle) != 1:
              raise SystemExit('expected exactly one fixed signal Vec')
          path.write_text(source.replace(needle, 'let mut signals = [', 1))
          PY
          cargo fmt --all
          git diff --check -- src/recall.rs
          if test -n "$(git status --porcelain --untracked-files=no | grep -Ev '^ M src/recall.rs$')"; then
            echo "Refusing to commit changes outside src/recall.rs" >&2
            git status --short >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/recall.rs
          git commit -m "DEN-866 use fixed array for score explanation"
          git push origin HEAD:agent/den-866-diversity-aware-recall
