name: report DEN-866 lock regeneration

on:
  push:
    branches:
      - agent/den-866-diversity-aware-recall
    paths:
      - .github/workflows/prune-den-866-lockfile.yml

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-866-diversity-aware-recall
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - name: Record proposed lockfile delta without applying it
        shell: bash
        run: |
          set -euo pipefail
          cp Cargo.lock /tmp/Cargo.lock.before
          rm Cargo.lock
          cargo generate-lockfile
          cp Cargo.lock /tmp/Cargo.lock.after
          cp /tmp/Cargo.lock.before Cargo.lock
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          def packages(path):
              data = tomllib.loads(Path(path).read_text())
              return {
                  (pkg['name'], pkg['version'], pkg.get('source'), pkg.get('checksum'))
                  for pkg in data.get('package', [])
              }

          before = packages('/tmp/Cargo.lock.before')
          after = packages('/tmp/Cargo.lock.after')
          added = sorted(after - before)
          removed = sorted(before - after)
          lines = [
              '# DEN-866 proposed Cargo.lock regeneration',
              '',
              f'* Existing package identities: {len(before)}',
              f'* Regenerated package identities: {len(after)}',
              f'* Added or version-changed identities: {len(added)}',
              f'* Removed or superseded identities: {len(removed)}',
              '',
              '## Added or version-changed',
              '',
              '```text',
          ]
          lines.extend(map(str, added))
          lines.extend(['```', '', '## Removed or superseded', '', '```text'])
          lines.extend(map(str, removed))
          lines.extend(['```', ''])
          Path('docs/den-866-lock-regeneration-report.md').write_text('\n'.join(lines))
          PY
          git diff --check -- docs/den-866-lock-regeneration-report.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/den-866-lock-regeneration-report.md
          git commit -m "DEN-866 report proposed lock regeneration"
          git push origin HEAD:agent/den-866-diversity-aware-recall
