name: diagnose DEN-866 rkyv dependency

on:
  push:
    branches:
      - agent/den-866-diversity-aware-recall
    paths:
      - .github/workflows/diagnose-den-866-rkyv.yml

permissions:
  contents: write

jobs:
  trace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-866-diversity-aware-recall
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - name: Record reverse dependency graph
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# DEN-866 rkyv reverse dependency diagnosis'
            echo
            echo '```text'
            cargo tree --locked -i rkyv@0.7.46
            echo
            echo '--- feature graph ---'
            cargo tree --locked -e features -i rkyv@0.7.46
            echo '```'
          } > docs/den-866-rkyv-tree.md
          git diff --check -- docs/den-866-rkyv-tree.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/den-866-rkyv-tree.md
          git commit -m "DEN-866 record rkyv reverse dependency graph"
          git push origin HEAD:agent/den-866-diversity-aware-recall
