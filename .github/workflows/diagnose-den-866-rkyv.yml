name: diagnose DEN-866 rkyv dependency

on:
  push:
    branches:
      - agent/den-866-diversity-aware-recall
    paths:
      - .github/workflows/diagnose-den-866-rkyv.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/den-866-diversity-aware-recall
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
      - name: Print reverse dependency graph
        run: |
          set -euo pipefail
          cargo tree --locked -i rkyv@0.7.46
          echo '--- direct feature graph ---'
          cargo tree --locked -e features -i rkyv@0.7.46
