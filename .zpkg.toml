[package]
org = "fiducia"
name = "fiducia-memory"
version = "0.1.0"
description = "Fiducia durable agent-memory library and API service"
license = "MIT"
keywords = ["memory", "agents", "pgvector", "postgres", "rust"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/fiducia-cloud/fiducia-memory.rs"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --locked"
exclude = [".env", ".env.*", ".direnv/**", ".zed/**", ".zed-pack/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[publish.native]
registry = "crates-io"
package = "fiducia-memory"

[targets.repository]
dir = "."
name = "fiducia-memory-repository"

[targets.rust]
dir = "."
adapter = "rust"

[install]
adapter = "rust"

[scripts]
test = "cargo test --all-targets --locked"
